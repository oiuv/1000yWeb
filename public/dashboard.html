<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="云端千年·炎黄新章账号中心，游戏注册、账号管理与人工充值登记。">
<title>用户中心 · 云端千年·炎黄新章</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<noscript><p class="notice">账号与充值操作需要启用 JavaScript。</p></noscript>
<main class="container" id="main">
  <div class="breadcrumb"><a href="index.html">首页</a> / 用户中心</div>
  <div class="page-heading"><div><span class="eyebrow">故人归来 · 整理行囊</span><h1>我的江湖</h1><p id="welcome">正在读取账号资料…</p></div><div class="actions"><a class="button" href="recharge.html">充值登记</a><a class="button secondary" id="admin-link" href="admin.html" hidden>管理中心</a></div></div>
  <div id="dashboard-feedback" class="form-feedback" role="alert" hidden></div>
  <div id="profile-content" hidden>
    <div class="profile-grid">
      <section>
        <div class="panel"><div class="panel-title"><h2>账号资料</h2><span class="small muted">炎黄新章</span></div><dl class="profile-details"><dt>游戏账号</dt><dd id="profile-account">—</dd><dt>联系邮箱</dt><dd id="profile-email">—</dd><dt>游戏登录</dt><dd id="profile-lastdate">—</dd></dl></div>
        <div class="panel"><div class="panel-title"><h2>江湖角色</h2></div><div id="character-list" class="character-list"></div><p class="hint section-gap">角色由游戏创建和维护，网站只展示账号已有的角色资料。</p></div>
      </section>
      <section class="panel"><div class="panel-title"><h2>修改游戏密码</h2></div>
        <form id="password-form">
          <div id="password-feedback" class="form-feedback" role="alert" hidden></div>
          <div class="field"><label for="oldPassword">原密码</label><input id="oldPassword" name="oldPassword" type="password" autocomplete="current-password" maxlength="100" required></div>
          <div class="field"><label for="newPassword">新密码</label><div class="password-wrap"><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="20" placeholder="6–20 位英文、数字或符号" required><button type="button" class="password-toggle" data-for="newPassword" aria-label="显示新密码" aria-pressed="false">显示</button></div><small class="hint">不含空格、中文和逗号。</small></div>
          <div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="20" required></div>
          <button class="button full" type="submit">确认修改密码</button>
          <p class="hint">修改后，所有网站登录会话将失效，需要重新登录。不强制断开正在运行的游戏。</p>
        </form>
      </section>
    </div>
    <section class="panel section-gap" id="records">
      <div class="panel-title"><h2>我的登记记录</h2><button type="button" class="button secondary compact" id="refresh-records">刷新</button></div>
      <p class="muted small">显示本账号提交的登记，包括为其它神武账号登记的记录。未关联登录账号的历史登记，请联系 GM 查询。</p>
      <div id="records-feedback" class="form-feedback" role="alert" hidden></div>
      <div class="table-wrap"><table class="record-table" id="records-table"><thead><tr><th>编号</th><th>付款时间 / 尾号</th><th>账号 / 角色</th><th>付款项</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>
      <div class="pagination"><span id="page-info">正在读取…</span><div class="actions"><button id="prev-page" class="button secondary compact" type="button" disabled>上一页</button><button id="next-page" class="button secondary compact" type="button" disabled>下一页</button></div></div>
    </section>
  </div>
  <dialog id="record-dialog"><div class="dialog-heading"><h2>登记详情</h2><button class="dialog-close" type="button" data-close-dialog aria-label="关闭登记详情">×</button></div><div id="record-detail"></div><div class="actions section-gap"><button type="button" class="button secondary" data-close-dialog>关闭</button></div></dialog>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
