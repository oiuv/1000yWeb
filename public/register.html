<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="云端千年·炎黄新章账号中心，游戏注册、账号管理与人工充值登记。">
<title>注册账号 · 云端千年·炎黄新章</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<noscript><p class="notice">账号与充值操作需要启用 JavaScript。</p></noscript>
<main class="container" id="main">
  <div class="breadcrumb"><a href="index.html">首页</a> / 注册账号</div>
  <div class="auth-layout">
    <aside class="auth-story"><span class="eyebrow">初入江湖 · 留下你的名字</span><h1>千年一场醉，<br>江湖等你来。</h1><p>注册的是账号，开启的是故事。<br>注册后请在游戏客户端中创建角色。</p><div class="story-bottom"><p>账号与密码请妥善保管。<br>邮箱及手机号码用于人工核验联系。</p></div></aside>
    <section class="auth-form">
      <h2>注册游戏账号</h2><p class="intro">创建炎黄新章账号。以下信息均为必填。</p>
      <form id="register-form">
        <div id="register-feedback" class="form-feedback" role="alert" hidden></div>
        <div class="field"><label for="account">游戏账号</label><input id="account" name="account" autocomplete="username" minlength="5" maxlength="12" pattern="[a-zA-Z0-9_]{5,12}" placeholder="5–12 位字母、数字或下划线" required></div>
        <div class="field"><label for="password">游戏密码</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="20" placeholder="6–20 位英文、数字或符号" aria-describedby="password-hint" required><button type="button" class="password-toggle" data-for="password" aria-label="显示游戏密码" aria-pressed="false">显示</button></div><small class="hint" id="password-hint">不含空格、中文和逗号；建议组合字母、数字与符号。</small></div>
        <div class="field"><label for="confirmPassword">确认密码</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="20" placeholder="再次输入密码" required></div>
        <div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="50" placeholder="用于账号联系与人工核验" required></div>
        <div class="field"><label for="telephone">手机号码</label><input id="telephone" name="telephone" type="tel" autocomplete="tel" inputmode="tel" pattern="1[3-9][0-9]{9}" maxlength="11" placeholder="请输入 11 位手机号码" required></div>
        <button class="button full" type="submit">创建账号 · 开启江湖</button>
      </form>
      <div id="registered-actions" class="actions section-gap" tabindex="-1" hidden><a class="button" href="login.html">立即登录</a><a class="button secondary" href="download.html">下载客户端</a></div>
      <p class="auth-switch">已有账号？ <a href="login.html">返回登录 →</a></p>
    </section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script type="module" src="js/register.js"></script>
</body>
</html>
