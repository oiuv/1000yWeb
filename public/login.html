<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="云端千年·炎黄新章账号中心，游戏注册、账号管理与人工充值登记。">
<title>账号登录 · 云端千年·炎黄新章</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<noscript><p class="notice">账号与充值操作需要启用 JavaScript。</p></noscript>
<main class="container" id="main">
  <div class="breadcrumb"><a href="index.html">首页</a> / 账号登录</div>
  <div class="auth-layout">
    <aside class="auth-story"><span class="eyebrow">云端千年 · 炎黄新章</span><h1>山河无恙，<br>少侠别来无恙。</h1><p>熟悉的名字，未完的故事。<br>登录账号中心，整理行囊，再赴江湖。</p><div class="story-bottom"><p>武林霸业谈笑中，<br>不胜千年一场醉。</p></div></aside>
    <section class="auth-form">
      <h2>账号登录</h2><p class="intro">使用炎黄新章游戏账号登录。</p>
      <form id="login-form">
        <div id="login-feedback" class="form-feedback" role="alert" hidden></div>
        <div class="field"><label for="account">游戏账号</label><input id="account" name="account" autocomplete="username" maxlength="20" placeholder="请输入游戏账号" required autofocus></div>
        <div class="field"><label for="password">游戏密码</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="100" placeholder="请输入密码" required><button type="button" class="password-toggle" data-for="password" aria-label="显示游戏密码" aria-pressed="false">显示</button></div></div>
        <button class="button full" type="submit">登录账号中心</button>
      </form>
      <p class="hint section-gap">忘记密码？请联系 GM 核验身份。请勿向他人提供账号密码。</p>
      <p class="auth-switch">尚未踏入江湖？ <a href="register.html">注册游戏账号 →</a></p>
    </section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script type="module" src="js/login.js"></script>
</body>
</html>
